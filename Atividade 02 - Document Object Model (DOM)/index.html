<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Alunos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Cadastro de Alunos</h2>

    <form id="formAluno">
      <input type="text" id="nome" name="nome" placeholder="Nome do aluno" required>
      <input type="number" id="nota" name="nota" placeholder="Nota" min="0" max="10" step="0.1" required>
      <button type="submit">Cadastrar</button>
    </form>

    <div class="botoes">
      <button id="mostrarTodos">Mostrar Todos</button>
      <button id="mostrarAprovados">Mostrar Aprovados</button>
    </div>

    <ul id="listaAlunos"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
